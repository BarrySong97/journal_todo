name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.1.21)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    name: Build ${{ matrix.name }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Apple signing credentials
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail

          if [[ -z "$APPLE_CERTIFICATE" || -z "$APPLE_CERTIFICATE_PASSWORD" || -z "$APPLE_API_KEY_CONTENT" || -z "$APPLE_API_KEY" || -z "$APPLE_API_ISSUER" || -z "$APPLE_SIGNING_IDENTITY" ]]; then
            echo "Missing Apple signing credentials in the release Environment." >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/apple-certificate.p12"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          keychain_path="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          printf '%s' "$APPLE_API_KEY_CONTENT" > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Build and publish GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && vars.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && vars.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && vars.APPLE_API_ISSUER || '' }}
        with:
          projectPath: packages/desktop
          tauriScript: pnpm tauri
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: JournalTodo ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          retryAttempts: 2
          args: --target ${{ matrix.target }}

  normalize-updater-json:
    name: Normalize updater download URLs
    environment: release
    needs: publish-tauri
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      REPOSITORY: ${{ github.repository }}

    steps:
      - name: Replace GitHub API asset URLs
        shell: bash
        run: |
          set -euo pipefail

          updater_dir="$RUNNER_TEMP/updater-json"
          mkdir -p "$updater_dir"

          gh release download "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --pattern latest.json \
            --dir "$updater_dir" \
            --clobber
          gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$updater_dir/release.json"

          UPDATER_DIR="$updater_dir" node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const updaterDir = process.env.UPDATER_DIR;
          const latestPath = path.join(updaterDir, "latest.json");
          const releasePath = path.join(updaterDir, "release.json");
          const latest = JSON.parse(fs.readFileSync(latestPath, "utf8"));
          const release = JSON.parse(fs.readFileSync(releasePath, "utf8"));
          const assetsById = new Map(
            release.assets.map((asset) => [String(asset.id), asset.browser_download_url]),
          );

          for (const [platform, entry] of Object.entries(latest.platforms)) {
            const assetId = entry.url.match(/\/releases\/assets\/(\d+)$/)?.[1];
            if (!assetId) {
              if (entry.url.includes("/releases/download/")) continue;
              throw new Error(`Unsupported updater URL for ${platform}: ${entry.url}`);
            }

            const downloadUrl = assetsById.get(assetId);
            if (!downloadUrl) {
              throw new Error(`Release asset ${assetId} for ${platform} was not found`);
            }
            entry.url = downloadUrl;
          }

          fs.writeFileSync(latestPath, `${JSON.stringify(latest, null, 2)}\n`);
          NODE

          gh release upload "$RELEASE_TAG" "$updater_dir/latest.json" \
            --repo "$REPOSITORY" \
            --clobber
